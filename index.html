<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备能耗分析 - 智能居家能耗管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        .container { width: 1000px; margin: 20px auto; padding: 20px; }
        .header { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #2c3e50; }
        .device-card { padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .card-title { font-size: 20px; margin-bottom: 15px; color: #2980b9; }
        .device-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #ecf0f1; }
        .device-name { font-size: 16px; display: flex; align-items: center; }
        .abnormal-tag { margin-left: 8px; padding: 2px 6px; background: #e74c3c; color: white; font-size: 12px; border-radius: 4px; }
        .device-rate { font-weight: bold; color: #e67e22; }
        .usage-tip { margin-top: 15px; padding: 10px; background: #f8f9fa; border-left: 4px solid #3498db; font-size: 14px; }
        .progress-bar { height: 8px; background: #ecf0f1; border-radius: 4px; flex: 1; margin: 0 15px; }
        .progress-fill { height: 100%; background: #3498db; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">设备能耗占比分析（多维度关联）</div>
        
        <div class="device-card">
            <div class="card-title">家电能耗占比</div>
            <div class="device-item">
                <span class="device-name">空调</span>
                <div class="progress-bar"><div class="progress-fill" style="width: 40%;"></div></div>
                <span class="device-rate">40%</span>
            </div>
            <div class="device-item">
                <span class="device-name">冰箱</span>
                <div class="progress-bar"><div class="progress-fill" style="width: 15%;"></div></div>
                <span class="device-rate">15%</span>
            </div>
            <div class="device-item">
                <span class="device-name">热水器 <span class="abnormal-tag">能耗异常</span></span>
                <div class="progress-bar"><div class="progress-fill" style="width: 25%;"></div></div>
                <span class="device-rate">25%</span>
            </div>
            <div class="device-item">
                <span class="device-name">其他家电</span>
                <div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div>
                <span class="device-rate">20%</span>
            </div>
            <div class="usage-tip">
                关联分析：热水器能耗异常（较上月↑30%），与每日使用时长从1小时增至2.5小时强相关，建议设置定时加热（仅早晚各1小时）降低能耗。
            </div>
        </div>

        <div class="device-card">
            <div class="card-title">高能耗设备使用建议</div>
            <div style="font-size: 16px; line-height: 1.8;">
                1. 空调：夏季设置温度≥26℃，冬季≤20℃，每调高/调低1℃可节能7%-10%；<br>
                2. 热水器：关闭全天候加热，使用前1小时开启，可降低50%待机能耗；<br>
                3. 冰箱：避免频繁开门，冷藏室温度设置4-5℃，冷冻室-18℃为宜。
            </div>
        </div>
    </div>
</body>
</html>
